[project]
name = "complaints-agent"
version = "0.1.0"
description = "A Claude agent for bank complaints, with MCP tools, skills and an eval suite"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
