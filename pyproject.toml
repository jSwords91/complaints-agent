[project]
name = "eval-driven-agent"
version = "0.1.0"
description = "An eval-driven Claude agent, with bank complaints as the example task"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
